name: Greedless Manager CI

on:
  push:
    branches: [greedless]
  pull_request:
    branches: [greedless]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned dependencies
        run: make setup
      - name: Verify formatting, lint, build, and localization
        run: make verify
      - name: Test development tooling
        run: make test-dev-tools
      - name: Run Swift tests
        run: LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift test
      - name: Verify local app packaging
        run: |
          make app
          codesign --verify --deep --strict "dist/Greedless Manager.app"
